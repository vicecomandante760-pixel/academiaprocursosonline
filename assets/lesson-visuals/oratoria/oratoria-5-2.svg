<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-oratoria-5-2 desc-oratoria-5-2">
<title id="title-oratoria-5-2">Ensaio com autoavaliação — Oratória</title>
<desc id="desc-oratoria-5-2">Infográfico de aula com conceito, exemplo aplicado e cuidado. Feedback eficaz é específico e orientado a comportamento e objetivo; peça exemplos e selecione uma melhoria praticável. Solicite retorno sobre clareza e tempo, compare observações e altere o roteiro. Feedback é perspectiva, não sentença sobre valor pessoal.</desc>
