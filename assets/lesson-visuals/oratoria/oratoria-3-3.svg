<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-oratoria-3-3 desc-oratoria-3-3">
<title id="title-oratoria-3-3">Pitch profissional — Oratória</title>
<desc id="desc-oratoria-3-3">Infográfico de aula com conceito, exemplo aplicado e cuidado. História profissional organiza situação, ação e aprendizado para ilustrar uma ideia sem substituir dados ou invadir privacidade. Conte um caso fictício ou autorizado, explique o contexto e conecte ao aprendizado da audiência. Anonimizar não basta quando a pessoa continua identificável.</desc>
