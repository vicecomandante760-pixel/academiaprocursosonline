<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-oratoria-4-3 desc-oratoria-4-3">
<title id="title-oratoria-4-3">Projeto de apresentação — Oratória</title>
<desc id="desc-oratoria-4-3">Infográfico de aula com conceito, exemplo aplicado e cuidado. Pergunta difícil pode ser respondida com escuta, delimitação do que sabe e compromisso de verificar o restante. Repita a pergunta para confirmar, responda com evidência e indique quando dará retorno. Reconhecer incerteza aumenta precisão; nunca invente resposta para parecer seguro.</desc>
