<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-oratoria-2-3 desc-oratoria-2-3">
<title id="title-oratoria-2-3">Linguagem corporal — Oratória</title>
<desc id="desc-oratoria-2-3">Infográfico de aula com conceito, exemplo aplicado e cuidado. Ensaio revela clareza, transições e duração; gravação é uma fonte de observação, não julgamento da pessoa. Escolha um critério por gravação, como volume audível, e repita após mudança específica. Proteja a gravação e apague-a quando não for mais necessária.</desc>
<rect width="900" height="760" rx="32" fill="#F7F8FA"/>
<circle cx="843" cy="57" r="23" fill="#55A9FF"/><circle cx="843" cy="57" r="8" fill="#18202E"/>
<text x="48" y="52" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="1" fill="#5D6675">AULA VISUAL · ORATÓRIA</text>
<text x="48" y="105" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="800" fill="#18202E"><tspan x="48" dy="0">Linguagem corporal</tspan></text>
<rect x="48" y="174" width="420" height="32" rx="16" fill="#55A9FF"/><text x="64" y="196" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing=".5" fill="#18202E">IDEIA · EXEMPLO · CUIDADO</text>
<rect x="48" y="226" width="804" height="190" rx="26" fill="#18202E"/><rect x="48" y="226" width="12" height="190" rx="6" fill="#55A9FF"/><text x="84" y="272" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#D8DEE8" text-anchor="start"><tspan x="84" dy="0">IDEIA CENTRAL</tspan></text><text x="84" y="326" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="84" dy="0">Ensaio revela clareza, transições e duração;</tspan><tspan x="84" dy="33">gravação é uma fonte de observação, não julgamento</tspan><tspan x="84" dy="33">da pessoa.</tspan></text><rect x="48" y="436" width="390" height="235" rx="24" fill="#FFFFFF" stroke="#E1E5EA" stroke-width="2"/><rect x="48" y="436" width="9" height="235" rx="4" fill="#55A9FF"/><text x="76" y="478" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing=".7" fill="#5D6675">NO EXEMPLO</text><text x="76" y="527" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="550" fill="#18202E"><tspan x="76" dy="0">Escolha um critério por</tspan><tspan x="76" dy="28">gravação, como volume</tspan><tspan x="76" dy="28">audível, e repita após</tspan><tspan x="76" dy="28">mudança específica.</tspan></text><rect x="462" y="436" width="390" height="235" rx="24" fill="#FFFFFF" stroke="#E1E5EA" stroke-width="2"/><rect x="462" y="436" width="9" height="235" rx="4" fill="#55A9FF"/><text x="490" y="478" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing=".7" fill="#5D6675">NÃO ESQUEÇA</text><text x="490" y="527" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="550" fill="#18202E"><tspan x="490" dy="0">Proteja a gravação e</tspan><tspan x="490" dy="28">apague-a quando não for</tspan><tspan x="490" dy="28">mais necessária.</tspan></text>
<text x="48" y="736" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#5D6675">SÍNTESE DIDÁTICA · APOIO AO ESTUDO, NÃO REGRA UNIVERSAL</text>
</svg>