<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-oratoria-1-3 desc-oratoria-1-3">
<title id="title-oratoria-1-3">Adaptação ao público — Oratória</title>
<desc id="desc-oratoria-1-3">Infográfico de aula com conceito, exemplo aplicado e cuidado. Adaptação considera conhecimento prévio, idioma, acessibilidade, contexto e interesse do público, sem estereótipos. Explique siglas e ofereça material legível para participantes que precisam consultar detalhes depois. Pergunte preferências quando possível; não presuma necessidades pelo perfil.</desc>
<rect width="900" height="760" rx="32" fill="#F7F8FA"/>
<circle cx="843" cy="57" r="23" fill="#55A9FF"/><circle cx="843" cy="57" r="8" fill="#18202E"/>
<text x="48" y="52" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="1" fill="#5D6675">AULA VISUAL · ORATÓRIA</text>
<text x="48" y="105" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="800" fill="#18202E"><tspan x="48" dy="0">Adaptação ao público</tspan></text>
<rect x="48" y="174" width="420" height="32" rx="16" fill="#55A9FF"/><text x="64" y="196" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing=".5" fill="#18202E">IDEIA · EXEMPLO · CUIDADO</text>
<rect x="48" y="226" width="804" height="190" rx="26" fill="#18202E"/><rect x="48" y="226" width="12" height="190" rx="6" fill="#55A9FF"/><text x="84" y="272" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#D8DEE8" text-anchor="start"><tspan x="84" dy="0">IDEIA CENTRAL</tspan></text><text x="84" y="326" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="84" dy="0">Adaptação considera conhecimento prévio, idioma,</tspan><tspan x="84" dy="33">acessibilidade, contexto e interesse do público, sem</tspan><tspan x="84" dy="33">estereótipos.</tspan></text><rect x="48" y="436" width="390" height="235" rx="24" fill="#FFFFFF" stroke="#E1E5EA" stroke-width="2"/><rect x="48" y="436" width="9" height="235" rx="4" fill="#55A9FF"/><text x="76" y="478" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing=".7" fill="#5D6675">NO EXEMPLO</text><text x="76" y="527" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="550" fill="#18202E"><tspan x="76" dy="0">Explique siglas e ofereça</tspan><tspan x="76" dy="28">material legível para</tspan><tspan x="76" dy="28">participantes que precisam</tspan><tspan x="76" dy="28">consultar detalhes depois.</tspan></text><rect x="462" y="436" width="390" height="235" rx="24" fill="#FFFFFF" stroke="#E1E5EA" stroke-width="2"/><rect x="462" y="436" width="9" height="235" rx="4" fill="#55A9FF"/><text x="490" y="478" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing=".7" fill="#5D6675">NÃO ESQUEÇA</text><text x="490" y="527" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="550" fill="#18202E"><tspan x="490" dy="0">Pergunte preferências</tspan><tspan x="490" dy="28">quando possível; não</tspan><tspan x="490" dy="28">presuma necessidades pelo</tspan><tspan x="490" dy="28">perfil.</tspan></text>
<text x="48" y="736" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#5D6675">SÍNTESE DIDÁTICA · APOIO AO ESTUDO, NÃO REGRA UNIVERSAL</text>
