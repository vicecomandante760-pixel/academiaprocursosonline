<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-vendas-5-1 desc-vendas-5-1">
<title id="title-vendas-5-1">Roteiro de diagnóstico e oferta — Técnicas de Vendas</title>
<desc id="desc-vendas-5-1">Infográfico de aula com conceito, exemplo aplicado e cuidado. Conversão é a proporção de ações definidas sobre um grupo elegível em período declarado; a fórmula depende do evento escolhido. Se 12 de 80 propostas enviadas foram aceitas no mês, a taxa é 15%; informe exatamente esse denominador. Não misture períodos, etapas ou bases distintas; taxas não explicam sozinhas causas.</desc>
