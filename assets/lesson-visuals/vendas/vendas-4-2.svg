<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-vendas-4-2 desc-vendas-4-2">
<title id="title-vendas-4-2">Métricas comerciais — Técnicas de Vendas</title>
<desc id="desc-vendas-4-2">Infográfico de aula com conceito, exemplo aplicado e cuidado. Negociação define interesses, limites e trocas possíveis. Registre concessão e contrapartida para não comprometer a entrega. Se reduzir escopo, ajuste preço ou prazo proporcionalmente e confirme por escrito o novo combinado. Não esconda custos nem aceite condições que inviabilizam qualidade ou conformidade.</desc>
