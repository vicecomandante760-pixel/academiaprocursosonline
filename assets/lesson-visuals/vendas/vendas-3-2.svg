<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-vendas-3-2 desc-vendas-3-2">
<title id="title-vendas-3-2">Diagnóstico e tratamento de objeções — Técnicas de Vendas</title>
<desc id="desc-vendas-3-2">Infográfico de aula com conceito, exemplo aplicado e cuidado. Uma oferta torna explícitos público, entrega, escopo, preço, condições, exclusões e suporte; isso permite avaliar adequação. Para consultoria, especifique quantidade de encontros, materiais, prazo de resposta, itens fora de escopo e forma de pagamento. Não prometa resultado que depende de fatores fora do controle do fornecedor.</desc>
<rect width="900" height="760" rx="32" fill="#F7F8FA"/>
<circle cx="843" cy="57" r="23" fill="#C9F33A"/><circle cx="843" cy="57" r="8" fill="#18202E"/>
<text x="48" y="52" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="1" fill="#5D6675">AULA VISUAL · TÉCNICAS DE VENDAS</text>
