<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-ia-aplicada-1-2 desc-ia-aplicada-1-2">
<title id="title-ia-aplicada-1-2">Alucinações e validação de informações — Inteligência Artificial Aplicada</title>
<desc id="desc-ia-aplicada-1-2">Infográfico de aula com conceito, exemplo aplicado e cuidado. Alucinação é saída apresentada com confiança que pode conter erro ou fonte inexistente. Separe fato, inferência e lacuna. Confira nome, data e citação numa fonte primária; se não localizar, remova ou sinalize como não confirmado. Não invente referências para preencher lacunas e não trate tom assertivo como evidência.</desc>
