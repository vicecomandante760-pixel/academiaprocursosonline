<title id="title-ia-aplicada-2-1">Anatomia de um bom prompt — Inteligência Artificial Aplicada</title>
<desc id="desc-ia-aplicada-2-1">Infográfico de aula com conceito, exemplo aplicado e cuidado. Prompt especifica tarefa, contexto relevante, público, formato de saída, restrições e critério de qualidade. Solicite tabela de riscos com evidência citada apenas do texto fornecido e coluna “não encontrado” quando faltar informação. Não inclua segredo, dado pessoal desnecessário ou instruções incompatíveis com direitos e segurança.</desc>
