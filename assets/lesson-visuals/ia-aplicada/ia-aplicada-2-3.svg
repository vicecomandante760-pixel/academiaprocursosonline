<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-ia-aplicada-2-3 desc-ia-aplicada-2-3">
<title id="title-ia-aplicada-2-3">Técnicas de refinamento — Inteligência Artificial Aplicada</title>
<desc id="desc-ia-aplicada-2-3">Infográfico de aula com conceito, exemplo aplicado e cuidado. Refinamento testa mudanças controladas. Registre versão, entrada, saída, critério e falhas para comparar de forma reproduzível. Altere apenas o formato solicitado e compare se precisão e completude se mantêm. Uma resposta melhor num caso não prova robustez em todos os contextos.</desc>
<rect width="900" height="760" rx="32" fill="#F7F8FA"/>
<circle cx="843" cy="57" r="23" fill="#8E7BFF"/><circle cx="843" cy="57" r="8" fill="#18202E"/>
<text x="48" y="52" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="1" fill="#5D6675">AULA VISUAL · INTELIGÊNCIA ARTIFICIAL APLICADA</text>
<text x="48" y="105" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="800" fill="#18202E"><tspan x="48" dy="0">Técnicas de refinamento</tspan></text>
<rect x="48" y="174" width="420" height="32" rx="16" fill="#8E7BFF"/><text x="64" y="196" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing=".5" fill="#18202E">IDEIA · EXEMPLO · CUIDADO</text>
<rect x="48" y="226" width="804" height="190" rx="26" fill="#18202E"/><rect x="48" y="226" width="12" height="190" rx="6" fill="#8E7BFF"/><text x="84" y="272" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#D8DEE8" text-anchor="start"><tspan x="84" dy="0">IDEIA CENTRAL</tspan></text><text x="84" y="326" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="84" dy="0">Refinamento testa mudanças controladas. Registre</tspan><tspan x="84" dy="33">versão, entrada, saída, critério e falhas para</tspan><tspan x="84" dy="33">comparar de forma reproduzível.</tspan></text><rect x="48" y="436" width="390" height="235" rx="24" fill="#FFFFFF" stroke="#E1E5EA" stroke-width="2"/><rect x="48" y="436" width="9" height="235" rx="4" fill="#8E7BFF"/><text x="76" y="478" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing=".7" fill="#5D6675">NO EXEMPLO</text><text x="76" y="527" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="550" fill="#18202E"><tspan x="76" dy="0">Altere apenas o formato</tspan><tspan x="76" dy="28">solicitado e compare se</tspan><tspan x="76" dy="28">precisão e completude se</tspan><tspan x="76" dy="28">mantêm.</tspan></text><rect x="462" y="436" width="390" height="235" rx="24" fill="#FFFFFF" stroke="#E1E5EA" stroke-width="2"/><rect x="462" y="436" width="9" height="235" rx="4" fill="#8E7BFF"/><text x="490" y="478" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing=".7" fill="#5D6675">NÃO ESQUEÇA</text><text x="490" y="527" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="550" fill="#18202E"><tspan x="490" dy="0">Uma resposta melhor num</tspan><tspan x="490" dy="28">caso não prova robustez em</tspan><tspan x="490" dy="28">todos os contextos.</tspan></text>
<text x="48" y="736" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#5D6675">SÍNTESE DIDÁTICA · APOIO AO ESTUDO, NÃO REGRA UNIVERSAL</text>
