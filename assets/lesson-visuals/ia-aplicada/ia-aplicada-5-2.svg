<title id="title-ia-aplicada-5-2">Checklist de validação e privacidade — Inteligência Artificial Aplicada</title>
<desc id="desc-ia-aplicada-5-2">Infográfico de aula com conceito, exemplo aplicado e cuidado. Checklist de publicação confere fatos, fontes, privacidade, viés, licença, acessibilidade e responsável pela aprovação. Registre quem revisou, quais fontes foram checadas e o que foi alterado antes da publicação. A lista reduz omissões, mas não substitui avaliação de risco contextual.</desc>
