<title id="title-ia-aplicada-5-1">Biblioteca de instruções e testes — Inteligência Artificial Aplicada</title>
<desc id="desc-ia-aplicada-5-1">Infográfico de aula com conceito, exemplo aplicado e cuidado. Rubrica converte qualidade em critérios observáveis, como correção, relevância, clareza e segurança, avaliados em casos distintos. Pontue três saídas com a mesma rubrica e revise os critérios quando avaliadores discordarem. Uma pontuação agregada pode ocultar falhas críticas; estabeleça critérios eliminatórios.</desc>
