<rect x="48" y="226" width="804" height="190" rx="26" fill="#18202E"/><rect x="48" y="226" width="12" height="190" rx="6" fill="#8E7BFF"/><text x="84" y="272" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#D8DEE8" text-anchor="start"><tspan x="84" dy="0">IDEIA CENTRAL</tspan></text><text x="84" y="326" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="84" dy="0">Exemplos no prompt demonstram padrão esperado; bons</tspan><tspan x="84" dy="33">exemplos e contraexemplos reduzem ambiguidades, mas</tspan><tspan x="84" dy="33">não garantem resposta correta.</tspan></text><rect x="48" y="436" width="390" height="235" rx="24" fill="#FFFFFF" stroke="#E1E5EA" stroke-width="2"/><rect x="48" y="436" width="9" height="235" rx="4" fill="#8E7BFF"/><text x="76" y="478" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing=".7" fill="#5D6675">NO EXEMPLO</text><text x="76" y="527" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="550" fill="#18202E"><tspan x="76" dy="0">Dê dois exemplos de</tspan><tspan x="76" dy="28">classificação e um</tspan><tspan x="76" dy="28">caso-limite, depois</tspan><tspan x="76" dy="28">verifique a saída num caso…</tspan></text><rect x="462" y="436" width="390" height="235" rx="24" fill="#FFFFFF" stroke="#E1E5EA" stroke-width="2"/><rect x="462" y="436" width="9" height="235" rx="4" fill="#8E7BFF"/><text x="490" y="478" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing=".7" fill="#5D6675">NÃO ESQUEÇA</text><text x="490" y="527" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="550" fill="#18202E"><tspan x="490" dy="0">Evite exemplos que induzam</tspan><tspan x="490" dy="28">vieses ou exponham dados</tspan><tspan x="490" dy="28">reais.</tspan></text>
