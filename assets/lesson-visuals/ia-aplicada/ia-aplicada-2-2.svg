<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-ia-aplicada-2-2 desc-ia-aplicada-2-2">
<title id="title-ia-aplicada-2-2">Prompts estruturados e exemplos — Inteligência Artificial Aplicada</title>
<desc id="desc-ia-aplicada-2-2">Infográfico de aula com conceito, exemplo aplicado e cuidado. Exemplos no prompt demonstram padrão esperado; bons exemplos e contraexemplos reduzem ambiguidades, mas não garantem resposta correta. Dê dois exemplos de classificação e um caso-limite, depois verifique a saída num caso novo. Evite exemplos que induzam vieses ou exponham dados reais.</desc>
<rect width="900" height="760" rx="32" fill="#F7F8FA"/>
<circle cx="843" cy="57" r="23" fill="#8E7BFF"/><circle cx="843" cy="57" r="8" fill="#18202E"/>
<text x="48" y="52" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="1" fill="#5D6675">AULA VISUAL · INTELIGÊNCIA ARTIFICIAL APLICADA</text>
<text x="48" y="105" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="800" fill="#18202E"><tspan x="48" dy="0">Prompts estruturados e exemplos</tspan></text>
