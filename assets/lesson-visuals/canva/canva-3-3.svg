<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-canva-3-3 desc-canva-3-3">
<title id="title-canva-3-3">Formatos e exportação — Canva para Negócios</title>
<desc id="desc-canva-3-3">Infográfico de aula com conceito, exemplo aplicado e cuidado. Produção em escala depende de componentes consistentes e revisão por peça, não de duplicação automática sem controle. Gere variações para produtos fictícios e confira nome, preço, imagem e CTA individualmente. Erros repetidos em lote ampliam o impacto; aprove a amostra antes de exportar tudo.</desc>
<rect width="900" height="760" rx="32" fill="#F7F8FA"/>
<circle cx="843" cy="57" r="23" fill="#FF70B5"/><circle cx="843" cy="57" r="8" fill="#18202E"/>
<text x="48" y="52" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="1" fill="#5D6675">AULA VISUAL · CANVA PARA NEGÓCIOS</text>
<text x="48" y="105" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="800" fill="#18202E"><tspan x="48" dy="0">Formatos e exportação</tspan></text>
