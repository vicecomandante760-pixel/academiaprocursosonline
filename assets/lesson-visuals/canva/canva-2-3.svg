<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-canva-2-3 desc-canva-2-3">
<title id="title-canva-2-3">Peças promocionais e criativos comerciais — Canva para Negócios</title>
<desc id="desc-canva-2-3">Infográfico de aula com conceito, exemplo aplicado e cuidado. Peça promocional deve tornar oferta e condições compreensíveis antes da ação; preço, prazo e restrições precisam de destaque proporcional. Mostre preço total, validade real e canal de compra no mesmo conjunto visual, em tamanho legível. Não use contraste baixo ou asteriscos minúsculos para esconder condições.</desc>
