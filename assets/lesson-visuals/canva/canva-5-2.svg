<title id="title-canva-5-2">Carrossel acessível com hierarquia — Canva para Negócios</title>
<desc id="desc-canva-5-2">Infográfico de aula com conceito, exemplo aplicado e cuidado. Direitos de uso variam por imagem, fonte, música e plano/licença. Registre fonte, autorização, finalidade e condições. Substitua uma foto encontrada em busca por ativo próprio ou licenciado com uso comercial permitido. Disponibilidade online não significa autorização; confirme termos atualizados.</desc>
