<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-canva-1-3 desc-canva-1-3">
<title id="title-canva-1-3">Organização de um kit de marca — Canva para Negócios</title>
<desc id="desc-canva-1-3">Infográfico de aula com conceito, exemplo aplicado e cuidado. Kit de marca reúne arquivos e regras: códigos de cor, fontes, espaçamento, versões e responsáveis por atualização. Inclua nome do arquivo, versão e origem de cada ativo para evitar uso de material desatualizado. Só inclua ativos cuja licença e autorização foram conferidas.</desc>
