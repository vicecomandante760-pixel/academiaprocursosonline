<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-canva-3-2 desc-canva-3-2">
<title id="title-canva-3-2">Produção em escala — Canva para Negócios</title>
<desc id="desc-canva-3-2">Infográfico de aula com conceito, exemplo aplicado e cuidado. Template reutilizável explicita campos editáveis e protege hierarquia, espaçamento e marca contra alterações acidentais. Marque placeholders e inclua instrução para limite de caracteres e troca de imagem. Um modelo rígido também pode falhar quando o texto ou o idioma muda; teste variações.</desc>
<rect width="900" height="760" rx="32" fill="#F7F8FA"/>
<circle cx="843" cy="57" r="23" fill="#FF70B5"/><circle cx="843" cy="57" r="8" fill="#18202E"/>
<text x="48" y="52" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="1" fill="#5D6675">AULA VISUAL · CANVA PARA NEGÓCIOS</text>
<text x="48" y="105" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="800" fill="#18202E"><tspan x="48" dy="0">Produção em escala</tspan></text>
<rect x="48" y="174" width="420" height="32" rx="16" fill="#FF70B5"/><text x="64" y="196" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing=".5" fill="#18202E">IDEIA · EXEMPLO · CUIDADO</text>
<rect x="48" y="226" width="804" height="190" rx="26" fill="#18202E"/><rect x="48" y="226" width="12" height="190" rx="6" fill="#FF70B5"/><text x="84" y="272" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#D8DEE8" text-anchor="start"><tspan x="84" dy="0">IDEIA CENTRAL</tspan></text><text x="84" y="326" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="84" dy="0">Template reutilizável explicita campos editáveis e</tspan><tspan x="84" dy="33">protege hierarquia, espaçamento e marca contra</tspan><tspan x="84" dy="33">alterações acidentais.</tspan></text><rect x="48" y="436" width="390" height="235" rx="24" fill="#FFFFFF" stroke="#E1E5EA" stroke-width="2"/><rect x="48" y="436" width="9" height="235" rx="4" fill="#FF70B5"/><text x="76" y="478" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing=".7" fill="#5D6675">NO EXEMPLO</text><text x="76" y="527" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="550" fill="#18202E"><tspan x="76" dy="0">Marque placeholders e</tspan><tspan x="76" dy="28">inclua instrução para</tspan><tspan x="76" dy="28">limite de caracteres e</tspan><tspan x="76" dy="28">troca de imagem.</tspan></text><rect x="462" y="436" width="390" height="235" rx="24" fill="#FFFFFF" stroke="#E1E5EA" stroke-width="2"/><rect x="462" y="436" width="9" height="235" rx="4" fill="#FF70B5"/><text x="490" y="478" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing=".7" fill="#5D6675">NÃO ESQUEÇA</text><text x="490" y="527" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="550" fill="#18202E"><tspan x="490" dy="0">Um modelo rígido também</tspan><tspan x="490" dy="28">pode falhar quando o texto</tspan><tspan x="490" dy="28">ou o idioma muda; teste</tspan><tspan x="490" dy="28">variações.</tspan></text>
<text x="48" y="736" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#5D6675">SÍNTESE DIDÁTICA · APOIO AO ESTUDO, NÃO REGRA UNIVERSAL</text>
