<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-canva-4-3 desc-canva-4-3">
<title id="title-canva-4-3">Projeto final de identidade aplicada — Canva para Negócios</title>
<desc id="desc-canva-4-3">Infográfico de aula com conceito, exemplo aplicado e cuidado. Auditoria visual verifica alinhamento, consistência, contraste, legibilidade e foco, além de adequação ao objetivo. Peça a alguém que não criou a arte para localizar a mensagem e a ação em poucos segundos. Não dependa exclusivamente de julgamento pessoal ou de uma única tela.</desc>
<rect width="900" height="760" rx="32" fill="#F7F8FA"/>
<circle cx="843" cy="57" r="23" fill="#FF70B5"/><circle cx="843" cy="57" r="8" fill="#18202E"/>
<text x="48" y="52" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="1" fill="#5D6675">AULA VISUAL · CANVA PARA NEGÓCIOS</text>
<text x="48" y="105" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="800" fill="#18202E"><tspan x="48" dy="0">Projeto final de identidade</tspan><tspan x="48" dy="44">aplicada</tspan></text>
<rect x="48" y="174" width="420" height="32" rx="16" fill="#FF70B5"/><text x="64" y="196" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing=".5" fill="#18202E">LEITURA E COMPARAÇÃO</text>
<rect x="48" y="226" width="804" height="190" rx="24" fill="#FFFFFF" stroke="#E1E5EA" stroke-width="2"/><rect x="48" y="226" width="9" height="190" rx="4" fill="#FF70B5"/><text x="76" y="264" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing=".7" fill="#5D6675">PRINCÍPIO VISUAL</text><text x="76" y="306" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="550" fill="#18202E"><tspan x="76" dy="0">Auditoria visual verifica alinhamento, consistência, contraste,</tspan><tspan x="76" dy="24">legibilidade e foco, além de adequação ao objetivo.</tspan></text><rect x="48" y="436" width="390" height="235" rx="24" fill="#FFFFFF" stroke="#E1E5EA" stroke-width="2"/><rect x="48" y="436" width="9" height="235" rx="4" fill="#FF70B5"/><text x="76" y="478" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing=".7" fill="#5D6675">EXEMPLO</text><text x="76" y="527" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="550" fill="#18202E"><tspan x="76" dy="0">Peça a alguém que não</tspan><tspan x="76" dy="28">criou a arte para</tspan><tspan x="76" dy="28">localizar a mensagem e a</tspan><tspan x="76" dy="28">ação em poucos segundos.</tspan></text><rect x="462" y="436" width="390" height="235" rx="24" fill="#FFFFFF" stroke="#E1E5EA" stroke-width="2"/><rect x="462" y="436" width="9" height="235" rx="4" fill="#FF70B5"/><text x="490" y="478" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing=".7" fill="#5D6675">CUIDADO</text><text x="490" y="527" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="550" fill="#18202E"><tspan x="490" dy="0">Não dependa exclusivamente</tspan><tspan x="490" dy="28">de julgamento pessoal ou</tspan><tspan x="490" dy="28">de uma única tela.</tspan></text>
