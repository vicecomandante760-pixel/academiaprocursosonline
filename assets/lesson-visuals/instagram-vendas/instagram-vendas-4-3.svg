<title id="title-instagram-vendas-4-3">Projeto de estratégia de 30 dias — Instagram para Vendas</title>
<desc id="desc-instagram-vendas-4-3">Infográfico de aula com conceito, exemplo aplicado e cuidado. Métricas de alcance, interação e ação respondem perguntas diferentes; cada taxa declara evento e denominador. Compare salvamentos por alcance em duas janelas equivalentes e explique mudanças de público ou distribuição. Confirme definições atuais no painel oficial; métricas disponíveis variam.</desc>
