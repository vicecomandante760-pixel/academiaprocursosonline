<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-administracao-4-3 desc-administracao-4-3">
<title id="title-administracao-4-3">Projeto integrador administrativo — Administração</title>
<desc id="desc-administracao-4-3">Infográfico de aula com conceito, exemplo aplicado e cuidado. Produtividade melhora fluxo sem retirar controle crítico, ergonomia, segurança ou qualidade da entrega. Localize espera ou retrabalho e proponha teste pequeno com indicador de segurança/qualidade. Automatizar não é sempre mais eficiente; monitore efeitos.</desc>
