<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-administracao-1-3 desc-administracao-1-3">
<title id="title-administracao-1-3">Gestão de processos — Administração</title>
<desc id="desc-administracao-1-3">Infográfico de aula com conceito, exemplo aplicado e cuidado. Processo descreve entradas, atividades, decisões, responsáveis, saídas e controles, incluindo exceções. Mapeie pedido, conferência, pagamento e entrega, indicando evidência de cada etapa. Documente a prática real antes de impor procedimento novo.</desc>
