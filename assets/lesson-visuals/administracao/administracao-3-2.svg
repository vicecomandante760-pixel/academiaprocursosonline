<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-administracao-3-2 desc-administracao-3-2">
<title id="title-administracao-3-2">Fluxo de caixa e capital de giro — Administração</title>
<desc id="desc-administracao-3-2">Infográfico de aula com conceito, exemplo aplicado e cuidado. Fluxo de caixa acompanha entradas e saídas por data; saldo é liquidez disponível, não medida completa de rentabilidade. Monte tabela mensal com saldo inicial, recebimentos, pagamentos e saldo final usando valores fictícios. Inclua atrasos e compromissos; não confunda previsão com garantia.</desc>
