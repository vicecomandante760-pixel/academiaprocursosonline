<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-administracao-4-2 desc-administracao-4-2">
<title id="title-administracao-4-2">KPIs e indicadores — Administração</title>
<desc id="desc-administracao-4-2">Infográfico de aula com conceito, exemplo aplicado e cuidado. Viabilidade compara benefícios esperados, custos, capacidade, risco e horizonte; decisões podem exigir análise profissional. Liste custos iniciais e recorrentes, capacidade mensal e hipótese de demanda antes de decidir. Tributos, crédito e investimento podem exigir contador ou consultor habilitado.</desc>
