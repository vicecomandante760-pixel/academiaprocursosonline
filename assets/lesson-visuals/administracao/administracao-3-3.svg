<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-administracao-3-3 desc-administracao-3-3">
<title id="title-administracao-3-3">Orçamento e análise de viabilidade — Administração</title>
<desc id="desc-administracao-3-3">Infográfico de aula com conceito, exemplo aplicado e cuidado. Capital de giro financia ciclo operacional entre pagar compromissos e receber vendas; prazo e estoque alteram a necessidade. Compare dois cenários de prazo de recebimento e pagamento e observe efeito sobre caixa. Necessidade depende do setor, sazonalidade e condições de crédito.</desc>
