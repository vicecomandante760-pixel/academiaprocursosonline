<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-administracao-1-2 desc-administracao-1-2">
<title id="title-administracao-1-2">Estrutura organizacional — Administração</title>
<desc id="desc-administracao-1-2">Infográfico de aula com conceito, exemplo aplicado e cuidado. Estrutura define responsabilidades e fluxos de decisão; clareza reduz lacunas sem exigir hierarquia complexa. Desenhe quem executa, aprova e recebe informação num pedido de compra. Funções podem se acumular em microempresa; registre substituição e limites.</desc>
