<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-administracao-4-1 desc-administracao-4-1">
<title id="title-administracao-4-1">Organização e produtividade — Administração</title>
<desc id="desc-administracao-4-1">Infográfico de aula com conceito, exemplo aplicado e cuidado. Orçamento explicita receitas, custos, datas e premissas; cenários mostram sensibilidade a mudanças relevantes. Monte cenário base, conservador e favorável alterando uma premissa por vez. Não use projeção como promessa nem omita custos indiretos.</desc>
