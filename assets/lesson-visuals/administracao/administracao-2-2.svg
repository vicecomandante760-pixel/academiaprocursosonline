<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-administracao-2-2 desc-administracao-2-2">
<title id="title-administracao-2-2">Planejamento estratégico — Administração</title>
<desc id="desc-administracao-2-2">Infográfico de aula com conceito, exemplo aplicado e cuidado. Planejamento estratégico conecta contexto, objetivo, escolha, recursos e revisão em horizonte definido. Escolha uma prioridade trimestral e liste o que será adiado para manter foco e capacidade. Plano não elimina incerteza; prepare alternativa para premissas frágeis.</desc>
