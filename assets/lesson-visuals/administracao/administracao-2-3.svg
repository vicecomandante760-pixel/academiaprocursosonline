<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-administracao-2-3 desc-administracao-2-3">
<title id="title-administracao-2-3">Execução e acompanhamento — Administração</title>
<desc id="desc-administracao-2-3">Infográfico de aula com conceito, exemplo aplicado e cuidado. Execução transforma objetivos em ações, responsáveis, prazo, dependências e evidência de conclusão. Use quadro semanal e regra para escalar atraso ou mudar prioridade. Evite medir atividade sem verificar resultado ou qualidade.</desc>
<rect width="900" height="760" rx="32" fill="#F7F8FA"/>
<circle cx="843" cy="57" r="23" fill="#F3C64E"/><circle cx="843" cy="57" r="8" fill="#18202E"/>
<text x="48" y="52" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="1" fill="#5D6675">AULA VISUAL · ADMINISTRAÇÃO</text>
<text x="48" y="105" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="800" fill="#18202E"><tspan x="48" dy="0">Execução e acompanhamento</tspan></text>
<rect x="48" y="174" width="420" height="32" rx="16" fill="#F3C64E"/><text x="64" y="196" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing=".5" fill="#18202E">IDEIA · EXEMPLO · CUIDADO</text>
<rect x="48" y="226" width="804" height="190" rx="26" fill="#18202E"/><rect x="48" y="226" width="12" height="190" rx="6" fill="#F3C64E"/><text x="84" y="272" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#D8DEE8" text-anchor="start"><tspan x="84" dy="0">IDEIA CENTRAL</tspan></text><text x="84" y="326" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="84" dy="0">Execução transforma objetivos em ações,</tspan><tspan x="84" dy="33">responsáveis, prazo, dependências e evidência de</tspan><tspan x="84" dy="33">conclusão.</tspan></text><rect x="48" y="436" width="390" height="235" rx="24" fill="#FFFFFF" stroke="#E1E5EA" stroke-width="2"/><rect x="48" y="436" width="9" height="235" rx="4" fill="#F3C64E"/><text x="76" y="478" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing=".7" fill="#5D6675">NO EXEMPLO</text><text x="76" y="527" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="550" fill="#18202E"><tspan x="76" dy="0">Use quadro semanal e regra</tspan><tspan x="76" dy="28">para escalar atraso ou</tspan><tspan x="76" dy="28">mudar prioridade.</tspan></text><rect x="462" y="436" width="390" height="235" rx="24" fill="#FFFFFF" stroke="#E1E5EA" stroke-width="2"/><rect x="462" y="436" width="9" height="235" rx="4" fill="#F3C64E"/><text x="490" y="478" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing=".7" fill="#5D6675">NÃO ESQUEÇA</text><text x="490" y="527" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="550" fill="#18202E"><tspan x="490" dy="0">Evite medir atividade sem</tspan><tspan x="490" dy="28">verificar resultado ou</tspan><tspan x="490" dy="28">qualidade.</tspan></text>
<text x="48" y="736" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#5D6675">SÍNTESE DIDÁTICA · APOIO AO ESTUDO, NÃO REGRA UNIVERSAL</text>
