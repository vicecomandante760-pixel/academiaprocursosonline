<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-administracao-5-1 desc-administracao-5-1">
<title id="title-administracao-5-1">Mapa de processo e responsáveis — Administração</title>
<desc id="desc-administracao-5-1">Infográfico de aula com conceito, exemplo aplicado e cuidado. KPI é medida ligada a uma pergunta de gestão; declare fórmula, unidade, fonte, frequência e responsável. Defina taxa de retrabalho e diga qual decisão será tomada se ela subir. Escolha indicador que não estimule ocultar erro ou sacrificar qualidade.</desc>
