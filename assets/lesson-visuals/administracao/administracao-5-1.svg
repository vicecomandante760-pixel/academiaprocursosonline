<circle cx="843" cy="57" r="23" fill="#F3C64E"/><circle cx="843" cy="57" r="8" fill="#18202E"/>
<text x="48" y="52" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="1" fill="#5D6675">AULA VISUAL · ADMINISTRAÇÃO</text>
