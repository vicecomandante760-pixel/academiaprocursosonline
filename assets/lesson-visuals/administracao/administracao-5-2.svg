<title id="title-administracao-5-2">Fluxo de caixa com cenários — Administração</title>
<desc id="desc-administracao-5-2">Infográfico de aula com conceito, exemplo aplicado e cuidado. Indicadores apoiam decisão quando interpretados com contexto e possíveis incentivos adversos. Combine tempo de resposta com satisfação/qualidade e confira se ambos representam o serviço. Uma meta isolada pode deslocar esforço de atividades importantes não medidas.</desc>
