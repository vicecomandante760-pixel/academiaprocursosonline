<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-lideranca-2-2 desc-lideranca-2-2">
<title id="title-lideranca-2-2">Motivação e desenvolvimento — Liderança</title>
<desc id="desc-lideranca-2-2">Infográfico de aula com conceito, exemplo aplicado e cuidado. Desenvolvimento combina interesse da pessoa, competência necessária, prática, apoio e revisão compartilhada. Planeje uma tarefa desafiadora com suporte e oportunidade de refletir sobre o aprendizado. Não prometa promoção ou resultado fora do seu controle.</desc>
