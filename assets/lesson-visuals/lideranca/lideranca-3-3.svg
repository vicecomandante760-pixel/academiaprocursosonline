<title id="title-lideranca-3-3">Resolução de conflitos — Liderança</title>
<desc id="desc-lideranca-3-3">Infográfico de aula com conceito, exemplo aplicado e cuidado. Feedback respeitoso separa observação de julgamento e conecta comportamento a efeito e expectativa futura. Descreva uma situação concreta, pergunte a perspectiva da pessoa e pactue ação e apoio. Considere segurança psicológica, poder e possibilidade de contestação.</desc>
