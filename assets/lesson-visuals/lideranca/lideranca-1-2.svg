<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-lideranca-1-2 desc-lideranca-1-2">
<title id="title-lideranca-1-2">Estilos e contextos de liderança — Liderança</title>
<desc id="desc-lideranca-1-2">Infográfico de aula com conceito, exemplo aplicado e cuidado. Abordagens de liderança devem ser escolhidas conforme tarefa, equipe e risco, com escuta e revisão da hipótese. Compare orientação mais estruturada com autonomia ampliada em dois cenários de experiência e urgência. Nenhum estilo funciona igualmente em todos os contextos.</desc>
