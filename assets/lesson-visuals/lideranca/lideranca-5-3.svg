<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-lideranca-5-3 desc-lideranca-5-3">
<title id="title-lideranca-5-3">Plano de 30 dias com medidas — Liderança</title>
<desc id="desc-lideranca-5-3">Infográfico de aula com conceito, exemplo aplicado e cuidado. Plano de desenvolvimento converte intenção em prática e acompanhamento colaborativo, não apenas promessa de produtividade. Defina três conversas, uma habilidade, recursos e sinais de progresso para 30 dias. Reveja metas se condições ou capacidade mudarem.</desc>
