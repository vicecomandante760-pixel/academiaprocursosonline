<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-lideranca-2-3 desc-lideranca-2-3">
<title id="title-lideranca-2-3">Delegação estratégica — Liderança</title>
<desc id="desc-lideranca-2-3">Infográfico de aula com conceito, exemplo aplicado e cuidado. Delegação transfere responsabilidade com resultado, autoridade, recursos, limites e pontos de apoio proporcionais ao risco. Registre qual decisão a pessoa pode tomar sozinha e quando deve escalar um problema. Acompanhar não é microgerenciar; ajuste frequência com a equipe.</desc>
