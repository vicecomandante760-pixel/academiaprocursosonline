<title id="title-lideranca-4-3">Plano de desenvolvimento de liderança — Liderança</title>
<desc id="desc-lideranca-4-3">Infográfico de aula com conceito, exemplo aplicado e cuidado. Encaminhamento define quando envolver RH, compliance, segurança ou liderança superior e como proteger pessoas e registros. Identifique canal institucional e urgência para uma situação fictícia; não prometa sigilo absoluto. Siga políticas e leis vigentes; evite investigar sem competência.</desc>
