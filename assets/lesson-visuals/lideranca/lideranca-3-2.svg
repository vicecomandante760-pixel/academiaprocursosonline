<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title-lideranca-3-2 desc-lideranca-3-2">
<title id="title-lideranca-3-2">Feedback e conversas difíceis — Liderança</title>
<desc id="desc-lideranca-3-2">Infográfico de aula com conceito, exemplo aplicado e cuidado. Autorregulação reconhece emoção e efeito antes de agir; pausa e pergunta ajudam a responder com intenção. Após conversa tensa, descreva fato, reação e resposta alternativa antes de retomar o diálogo. Não use linguagem emocional para desqualificar preocupação legítima.</desc>
<rect width="900" height="760" rx="32" fill="#F7F8FA"/>
<circle cx="843" cy="57" r="23" fill="#51C99A"/><circle cx="843" cy="57" r="8" fill="#18202E"/>
<text x="48" y="52" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="1" fill="#5D6675">AULA VISUAL · LIDERANÇA</text>
<text x="48" y="105" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="800" fill="#18202E"><tspan x="48" dy="0">Feedback e conversas difíceis</tspan></text>
